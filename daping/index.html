<!DOCTYPE html>
<html lang="zh-CN">
<title>叫号大屏</title>
<meta charset="UTF-8">
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑;}
    body{background:#0a1629;color:white;padding:40px 20px;}
    .title{text-align:center;font-size:36px;margin-bottom:40px;color:#ffd700;}
    .current{background:#19be6b;padding:30px;text-align:center;border-radius:12px;margin-bottom:30px;}
    .num{font-size:60px;font-weight:bold;color:#ffd700;}
    .item{display:flex;justify-content:space-between;padding:15px;background:rgba(255,255,255,0.1);margin-bottom:8px;border-radius:6px;font-size:18px;}
</style>

<h1 class="title">中医科室 - 实时叫号</h1>
<div class="current"><div id="current" class="num">等待叫号</div></div>
<div id="queueList"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyD-9tSr4K6B3XZ7K8Z9X0Y1W2V3U4T5S6A7S8D9F0G1H2J3K4L5M6N7O8P9Q0R1S2T3U4V5W6X7Y8Z9",
    authDomain: "hospital-queue-12345.firebaseapp.com",
    databaseURL: "https://hospital-queue-12345-default-rtdb.firebaseio.com",
    projectId: "hospital-queue-12345",
    storageBucket: "hospital-queue-12345.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef1234567890abcdef"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const queueRef = db.ref('queue');
let queue = [];
let lastCalledNum = null;

// 语音播报
function voiceSpeak(text) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';
    window.speechSynthesis.speak(u);
}

// 刷新大屏
function refreshScreen() {
    const cur = queue.find(i => i.status === '叫号中');
    document.getElementById('current').innerText = cur ? `${cur.num}号 ${cur.name}` : '等待叫号';
    
    const list = document.getElementById('queueList');
    list.innerHTML = '';
    queue.filter(i => i.status === '等待中').forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText = `${item.num}号 - ${item.name}`;
        list.appendChild(div);
    });
    
    if (cur && cur.num !== lastCalledNum) {
        voiceSpeak(`请${cur.num}号${cur.name}患者到中医科室就诊`);
        lastCalledNum = cur.num;
    }
}

// 监听云端队列（实时同步）
queueRef.on('value', (snap) => {
    queue = snap.val() || [];
    refreshScreen();
});
</script>
</body>
</html>
