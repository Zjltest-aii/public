<!DOCTYPE html>
<html lang="zh-CN">
<title>医生叫号</title>
<meta charset="UTF-8">
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑;}
    body{background:#f5f5f5;padding:20px;}
    .container{max-width:800px;margin:0 auto;background:white;padding:30px;border-radius:12px;}
    h2{text-align:center;color:#19be6b;margin-bottom:20px;}
    .time-set{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    .time-set input{padding:8px;width:120px;border:1px solid #ddd;border-radius:6px;}
    .time-set button{padding:8px 16px;background:#2d8cf0;color:white;border:none;border-radius:6px;cursor:pointer;}
    .call-box{display:flex;gap:15px;margin:20px 0;flex-wrap:wrap;}
    .call-btn{padding:15px 25px;font-size:18px;background:#ff7d00;color:white;border:none;border-radius:8px;cursor:pointer;}
    .repeat-btn{background:#9370DB;}
    .reset-btn{background:#ff4d4f;}
    .current{font-size:24px;text-align:center;padding:20px;background:#f8f9fa;border-radius:8px;margin:20px 0;font-weight:bold;}
    .queue-item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;}
    .calling{color:#ff7d00;font-weight:bold;}
</style>

<div class="container">
    <h2>中医科室 - 医生叫号</h2>
    <div class="time-set">
        <input type="time" id="startTime" value="08:00">
        <input type="time" id="endTime" value="17:00">
        <button onclick="saveTime()">保存取号时间</button>
    </div>
    <div class="call-box">
        <button class="call-btn" onclick="callNumber()">下一号</button>
        <button class="call-btn repeat-btn" onclick="repeatCall()">重复叫号</button>
        <button class="call-btn" onclick="passNumber()">过号</button>
        <button class="call-btn reset-btn" onclick="resetQueue()">今日重置</button>
    </div>
    <div class="current">当前叫号：<span id="currentNum">无</span></div>
    <div id="queueList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyD-9tSr4K6B3XZ7K8Z9X0Y1W2V3U4T5S6A7S8D9F0G1H2J3K4L5M6N7O8P9Q0R1S2T3U4V5W6X7Y8Z9",
    authDomain: "hospital-queue-12345.firebaseapp.com",
    databaseURL: "https://hospital-queue-12345-default-rtdb.firebaseio.com",
    projectId: "hospital-queue-12345",
    storageBucket: "hospital-queue-12345.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef1234567890abcdef"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const queueRef = db.ref('queue');
const timeConfigRef = db.ref('timeConfig');
let queue = [];

// 语音播报
function voiceSpeak(text) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';
    window.speechSynthesis.speak(u);
}

// 保存时间
async function saveTime() {
    const s = document.getElementById('startTime').value;
    const e = document.getElementById('endTime').value;
    await timeConfigRef.set({start:s, end:e});
    alert('设置成功');
}

// 渲染
function render() {
    const list = document.getElementById('queueList');
    list.innerHTML = '';
    queue.forEach(item => {
        const div = document.createElement('div');
        div.className = 'queue-item';
        div.innerHTML = `<span>${item.num}号 ${item.name}</span><span class="${item.status === '叫号中' ? 'calling' : ''}">${item.status}</span>`;
        list.appendChild(div);
    });
    const cur = queue.find(i => i.status === '叫号中');
    document.getElementById('currentNum').innerText = cur ? `${cur.num}号 ${cur.name}` : '无';
}

// 监听云端队列变化（实时同步）
queueRef.on('value', (snap) => {
    queue = snap.val() || [];
    render();
});

// 下一号
async function callNumber() {
    const idx = queue.findIndex(i => i.status === '等待中');
    if (idx === -1) {
        voiceSpeak('排队已完成');
        return;
    }
    queue.forEach(i => i.status === '叫号中' && (i.status = '已就诊'));
    queue[idx].status = '叫号中';
    await queueRef.set(queue);
    voiceSpeak(`请${queue[idx].num}号${queue[idx].name}患者到中医科室就诊`);
}

// 重复叫号
function repeatCall() {
    const cur = queue.find(i => i.status === '叫号中');
    if (!cur) {
        voiceSpeak('当前无叫号患者');
        return;
    }
    voiceSpeak(`请${cur.num}号${cur.name}患者尽快就诊`);
}

// 过号
async function passNumber() {
    const idx = queue.findIndex(i => i.status === '叫号中');
    if (idx !== -1) {
        queue[idx].status = '已过号';
        await queueRef.set(queue);
        callNumber();
    }
}

// 重置
async function resetQueue() {
    if (!confirm('确定重置？')) return;
    await queueRef.set([]);
    await db.ref('lastDate').set(new Date().toDateString());
}

// 初始化时间
timeConfigRef.once('value', (snap) => {
    const cfg = snap.val() || {start:"08:00", end:"17:00"};
    document.getElementById('startTime').value = cfg.start;
    document.getElementById('endTime').value = cfg.end;
});
</script>
</body>
</html>
